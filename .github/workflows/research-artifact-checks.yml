name: Research artifact static checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned JSON Schema validator
        run: python -m pip install -r requirements-dev.txt
      - name: Validate public research-only artifacts
        run: python scripts/validate_research_artifacts.py
      - name: Test schema contracts with fictional inputs only
        run: python -m unittest discover -s tests -v
